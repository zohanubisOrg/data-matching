[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "product-image-pos-reconciliation"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pandas>=2.2,<3",
  "openpyxl>=3.1,<4",
  "rapidfuzz>=3.9,<4",
  "pydantic>=2,<3",
  "google-genai==2.25.0",
  "typer>=0.12,<1",
  "rich>=13,<15",
  "Pillow>=10,<12",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
barcode = ["zxing-cpp>=2.2,<3"]

[project.scripts]
product-mapper = "product_mapper.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=.pytest-tmp"

