name: Name-only POS match experiment

on:
  push:
    branches:
      - feat/name-only-pos-matching
    paths:
      - .github/workflows/name-only-match.yml
      - src/product_mapper/matching/name_only.py
      - src/product_mapper/cli.py

permissions:
  contents: read

jobs:
  match-names:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package
        run: python -m pip install -e .

      - name: Run name-only matching
        run: |
          python -m product_mapper.cli match-names \
            --pos Products_imported_to_Shopbox_19_08_26_with_SKU.xlsx \
            --imports Ten_hang_nhap.xlsx \
            --output output/name-only
          cat output/name-only/name_only_summary.json

      - name: Upload experiment results
        uses: actions/upload-artifact@v4
        with:
          name: name-only-match-results
          path: |
            output/name-only/name_only_match.xlsx
            output/name-only/name_only_match.csv
            output/name-only/name_only_summary.json
          if-no-files-found: error
